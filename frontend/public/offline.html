<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>You are offline | NTSOne</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { --bg: #f6faff; --card: #ffffff; --text: #0f2a5c; --muted: #4b6591; --primary: #2563eb; --border: #d6e4fb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1220; --card: #111a2e; --text: #e8efff; --muted: #9fb2d6; --primary: #60a5fa; --border: #1f2c4a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--text); font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      main { width: 100%; max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 36px 28px; box-shadow: 0 20px 50px rgba(37, 99, 235, 0.12); }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { margin: 20px 0 8px; font-size: 22px; line-height: 1.3; }
      p { margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: var(--muted); }
      button { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(135deg, #1d4ed8, #0ea5e9); padding: 13px 28px; border-radius: 999px; min-width: 160px; }
      button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
      .status { margin-top: 18px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="84" height="84" />
      <h1>You are offline</h1>
      <p>NTSOne could not reach the internet. Check your connection and try again.</p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>

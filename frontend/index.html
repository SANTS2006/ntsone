<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NTSOne | Registrations, voting polls, orders, payments, bookkeeping, invoices, receipts and wish lists</title>
    <!-- Public pages are listed; signed-in and personal pages switch this to noindex as they open. -->
    <meta name="robots" id="robots-meta" content="index, follow" />
    <meta
      name="description"
      id="description-meta"
      content="Build registration forms, run free or paid voting polls, take orders, get paid with mobile money, keep your business books, send invoices and receipts, and issue ID cards and tickets from one secure platform."
    />
    <link rel="canonical" id="canonical-link" href="%SITE_URL%/" />
    <meta name="application-name" content="NTSOne" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Installed to the home screen (iPhone, iPad and Android): opens full screen like an app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NTSOne" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews on WhatsApp, Facebook, LinkedIn, X, and other apps. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NTSOne" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" id="og-title" content="NTSOne" />
    <meta
      property="og:description"
      id="og-description"
      content="Registration forms, voting polls, orders, mobile money payments, bookkeeping, wish lists, invoices, ID cards and tickets in one secure platform."
    />
    <meta property="og:url" id="og-url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NTSOne logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" id="twitter-title" content="NTSOne" />
    <meta
      name="twitter:description"
      id="twitter-description"
      content="Registration forms, voting polls, orders, invoices, ID cards and tickets in one secure platform."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "NTSOne",
        "url": "%SITE_URL%/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Build registration forms, run free or paid voting polls, take orders, get paid with mobile money, keep your business books, send invoices and receipts, and issue ID cards and tickets from one secure platform.",
        "image": "%SITE_URL%/og-image.png",
        "publisher": { "@type": "Organization", "name": "NTS Digital Solutions", "email": "hello@ntsdigitalsolutions.com" }
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; padding: 1rem">
        NTSOne needs JavaScript to run. Please turn on JavaScript in your browser and reload the page.
      </p>
    </noscript>
    <div id="root">
      <!-- Shown until the app starts: the logo inside a turning ring. React replaces it. -->
      <div role="status" aria-label="Loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center">
          <div class="boot-ring" style="position:absolute;inset:0;border-radius:9999px;border:4px solid rgba(37,99,235,.15);border-top-color:#2563eb;border-right-color:rgba(37,99,235,.6)"></div>
          <img src="/favicon.png" alt="" width="36" height="36" style="width:36px;height:36px;object-fit:contain" />
        </div>
        <style>.boot-ring{animation:boot-spin .9s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.boot-ring{animation:none}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

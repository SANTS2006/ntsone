# Load balancer in front of several NTSOne API servers. Used by deploy/docker-compose.scale.yml.
# Requests are sent to the server with the fewest open connections; a server that stops answering is skipped for a while.
worker_processes auto;
events { worker_connections 8192; }

http {
  upstream ntsone_api {
    least_conn;
    # Docker resolves "api" to every replica; add one `server` line per machine instead when balancing across hosts.
    server api:10000 max_fails=3 fail_timeout=10s;
    keepalive 256;
  }

  # Real client address for the API's per-address limits (the API trusts X-Forwarded-For).
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;
  # A request that is not safe to repeat (a payment) is never retried on another server after it was sent.
  proxy_next_upstream_timeout 5s;

  # A blunt outer shield; the API has its own finer per-route limits. Webhooks come from few addresses, so they get more room.
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=hooks:5m rate=500r/s;

  server {
    listen 80;
    client_max_body_size 12m;
    gzip on;

    location /api/webhooks/ {
      limit_req zone=hooks burst=1000 nodelay;
      proxy_read_timeout 10s;
      proxy_pass http://ntsone_api;
    }
    location / {
      limit_req zone=api burst=200 nodelay;
      proxy_read_timeout 60s;
      proxy_pass http://ntsone_api;
    }
  }
}
